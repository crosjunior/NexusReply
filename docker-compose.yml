# ReplyFlow na VPS: app (Next.js) + worker
# Nginx Proxy Manager (OpenResty) gerencia SSL/roteamento externo para porta 3001
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: replyflow:latest
    ports:
      - "3001:3000"
    env_file: .env
    restart: unless-stopped
    networks: [web, supabase]

  worker:
    image: replyflow:latest
    depends_on: [app]
    env_file: .env
    command: ["node", "dist/worker.mjs"]
    restart: unless-stopped
    healthcheck:
      disable: true
    networks: [supabase]

networks:
  web: {}
  supabase:
    external: true
    name: ${SUPABASE_DOCKER_NETWORK:-supabase_default}
